version: 1

name: counter

entrypoint: main.py

trigger:
  # Hourly rather than every minute: the counter is also the integration used
  # by the README walkthrough, where three manual runs must read 1, 2, 3. An
  # every-minute schedule would race that check roughly one run in six.
  cron: "0 * * * *"

retry:
  attempts: 3

timeout: 30
