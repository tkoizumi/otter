version: 1

name: customer-sync

description: Sync customers from a mock source API into a mock destination API.

entrypoint: main.py

python:
  executable: python3

timeout: 120

concurrency: 1

retry:
  attempts: 3
  backoff: exponential
  initial_delay: 1s
  max_delay: 10s

env:
  SOURCE_API_URL: http://127.0.0.1:8899
  DEST_API_URL: http://127.0.0.1:8899
