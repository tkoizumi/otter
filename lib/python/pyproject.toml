[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otter-connectors"
version = "0.1.0"
description = "Shared Shopify and Salesforce clients for Otter integrations"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["otter_connectors*", "otter_schema*"]
