[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otter-connectors"
version = "0.1.0"
description = "Shared Shopify and Salesforce clients for Otter integrations"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = []

# Development only, and deliberately an extra rather than a dependency: nothing
# in a prepared runtime environment needs them. `graphql-core` converts Shopify
# introspection to SDL and validates `.graphql` documents -- a pull-time and
# test-time job, not a run-time one.
[project.optional-dependencies]
dev = ["graphql-core>=3.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["otter_connectors*", "otter_schema*"]
