name: test

# Everything that must pass before a release tag is allowed to publish. The
# release workflow runs the release job only after this suite, so a red suite
# on the tag commit fails the release instead of shipping a binary.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The Go suite starts real Python child processes. Without this, the
      # daemon tests call requirePython, which *skips* rather than fails
      # (internal/daemon/daemon_test.go), so a runner missing python3 would
      # silently drop the crash/kill harness and every job-execution
      # assertion — a green job with no evidence behind it. Pin the same
      # version the SDK job uses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # `gofmt -l` prints offenders and exits 0, so it has to be wrapped to
      # fail the job. Printing filenames on its own enforces nothing.
      - name: gofmt
        run: |
          files="$(gofmt -l ./cmd ./internal ./sdk ./migrations)"
          if [ -n "$files" ]; then
            echo "gofmt needed for:"
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      # The child-lifetime regression test (internal/executor/proc_linux_test.go)
      # runs on this Linux runner and asserts that a child dies when its parent
      # is SIGKILLed. macOS has no parent-death signal, so that guarantee is
      # explicitly excluded there rather than tested; see
      # docs/architecture.md#child-lifetime-is-platform-specific. The
      # release-config job below still cross-compiles darwin.
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Embedded SDK suite
        run: python3 -m unittest discover -s sdk/python/tests

  # The product, driven the way a user drives it: `otter init` in a temporary
  # workspace, then validate, release, start, run and read back state. This is
  # what keeps the scaffold and the docs from drifting apart.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make smoke

  # The host-side scripts, and the two checks that report to CloudWatch. These
  # were manual-only, and an audit on 2026-10-01 found what that cost: the
  # publisher's suite was green with the publisher completely unsigned, and the
  # disk check's suite and drill were green with the check publishing a
  # differently-named metric. Neither the suites nor the two drills were in CI.
  #
  # `make test-shell` runs every scripts/test-*.sh suite; `make test-monitoring`
  # runs the liveness and disk-pressure drills, which need a built otterd. The
  # remaining drills that need no Docker run in the `drills` job below; the two
  # that need a privileged systemd container stay out of CI deliberately.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make test-shell
      - run: make test-monitoring

  # The operating drills that need neither Docker nor a host. Each asserts an
  # instruction docs/operations.md makes, and a drill that cannot run exits
  # non-zero rather than skipping, so a missing prerequisite is a red job rather
  # than a quiet pass.
  #
  # `upgrade` builds the previous release tag from source, which is why the
  # checkout needs its tags (`fetch-depth: 0`) and a Go toolchain.
  drills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make drill DRILL=backup-restore
      - run: make drill DRILL=upgrade
      - run: make drill DRILL=downgrade-refusal
      - run: make drill DRILL=secret-rotation

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The release pipeline's own config, checked on every change to it rather
      # than discovered to be broken by a tag. `check` validates the schema;
      # `build --snapshot` proves the four targets actually compile and package
      # into the names the cask and any installer expect.
      - name: Validate
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Build without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: The archive names install.sh and the cask depend on
        run: |
          set -e
          for want in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            ls dist/otter_*_${want}.tar.gz >/dev/null || {
              echo "missing archive for ${want}"; ls dist; exit 1; }
          done
          tar tzf "$(ls dist/otter_*_darwin_arm64.tar.gz)" | sort
          test -f dist/checksums.txt
      # Naming is not enough: the archive has to install and run a job on a host
      # with no checkout. This is CA-24's fresh-host first success, driven
      # entirely by the extracted binaries.
      - name: The archive installs and runs a job outside the checkout
        run: |
          set -e
          archive="$(ls "$PWD"/dist/otter_*_linux_amd64.tar.gz)"
          OTTER_ARCHIVE="$archive" make drill DRILL=fresh-archive
