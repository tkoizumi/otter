# One page of products changed since the watermark.
#
# Products rather than variants, because a product-level change does not bump
# its variants' updatedAt: 14 of 17 products in this store are newer than every
# one of their variants. A variant-level watermark would never re-sync a renamed
# product, and the mapping reads product.title.
#
# `variants` is a nested connection and Shopify caps it, so pageInfo is selected
# and the caller fetches the remainder with product-variants.graphql whenever
# hasNextPage is true. That is the truncation fix: the cap is detected rather
# than assumed away.
query Products($first: Int!, $after: String, $query: String!, $sortKey: ProductSortKeys!) {
  products(first: $first, after: $after, query: $query, sortKey: $sortKey) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      title
      hasOnlyDefaultVariant
      updatedAt
      variants(first: 250) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          id
          sku
          title
          price
        }
      }
    }
  }
}
