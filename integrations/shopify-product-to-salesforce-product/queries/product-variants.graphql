# The remainder of one product's variants, fetched only when the nested
# `variants(first: 250)` in products.graphql reports hasNextPage.
#
# `$filter` is Shopify's search syntax, not an argument -- it arrives as
# "product_id:123". Shopify does not validate a filter field name, so a typo
# matches everything instead of erroring; tests/test_source.py asserts the shape.
query MoreVariants($first: Int!, $after: String, $filter: String!) {
  productVariants(first: $first, after: $after, query: $filter) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      sku
      title
      price
    }
  }
}
