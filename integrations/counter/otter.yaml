# Otter manifest. Every field is documented in docs/manifest-reference.md.
version: 1

name: counter 
description: What this integration does.

entrypoint: main.py

# No trigger: manual runs only, so nothing fires while you work. Add one when
# the integration is ready, then restart the runtime to register it:
#
# trigger:
#   cron: "*/5 * * * *"

# Secrets are read from the DAEMON's environment, never from this file:
# `otter inspect` prints everything here, so a secret belongs in the
# workspace's otter.env (which `otter start` loads) and is named here:
#
# secrets:
#   - TSHIRT_COMPANY_TOKEN

# Non-secret, deployment-specific settings. Values may reference the daemon
# environment with ${VAR}.
env:
  LOG_LEVEL: info

timeout: 30

retry:
  attempts: 3
  backoff: exponential
  initial_delay: 5s
